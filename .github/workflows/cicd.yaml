name: FraudGuard CI and Render Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  APP_ENV: "ci"
  FRAUD_MODEL_MODE: "transaction_candidate"
  AUTH_REQUIRED: "true"
  FRAUDGUARD_API_KEY: "ci-test-key"
  TRANSACTION_CANDIDATE_ARTIFACT_ROOT: "artifacts/benchmark/transaction_data/candidate"
  ARTIFACT_CACHE_ROOT: "artifacts/releases"

jobs:
  verify:
    name: Clean checkout verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e .
          python -m pip install black flake8

      - name: Format and lint checks
        run: |
          black --check app.py src tests scripts
          flake8 app.py src tests scripts

      - name: Retired legacy dataset guard
        run: python scripts/check_no_retired_legacy_paths.py

      - name: Tests
        run: pytest -q -p no:cacheprovider

      - name: Compile imports
        run: python -m compileall app.py src scripts

      - name: OpenSpec validation
        run: openspec validate --all --strict --no-interactive

      - name: Fixture predeploy validation
        run: python scripts/provider_predeploy.py

      - name: Build container
        run: docker build -t fraudguard-api:${{ github.sha }} .

  deploy-render:
    name: Protected Render deploy
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL" >/dev/null

      - name: Post-deployment smoke test
        env:
          PUBLIC_BASE_URL: ${{ secrets.RENDER_PUBLIC_BASE_URL }}
          FRAUDGUARD_API_KEY: ${{ secrets.FRAUDGUARD_API_KEY }}
        run: |
          test -n "$PUBLIC_BASE_URL"
          test -n "$FRAUDGUARD_API_KEY"
          python scripts/render_smoke.py
