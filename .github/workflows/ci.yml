name: FraudGuard CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  APP_ENV: "ci"
  FRAUD_MODEL_MODE: "transaction_candidate"
  AUTH_REQUIRED: "true"
  FRAUDGUARD_API_KEY: "ci-test-key"
  TRANSACTION_CANDIDATE_ARTIFACT_ROOT: "artifacts/benchmark/transaction_data/candidate"
  ARTIFACT_CACHE_ROOT: "artifacts/releases"

jobs:
  backend-quality:
    name: Backend lint, format, and static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e .
          python -m pip install black==24.10.0 flake8==7.3.0 mypy==1.20.2

      - name: Format check
        run: black --check app.py src tests scripts

      - name: Lint check
        run: flake8 app.py src tests scripts --max-line-length=120 --extend-ignore=E203,W503

      - name: Static type analysis
        run: |
          python -m mypy app.py src/FraudGuard/cloud src/FraudGuard/pipeline/transaction_candidate_pipeline.py \
            --ignore-missing-imports \
            --no-strict-optional \
            --allow-untyped-defs \
            --check-untyped-defs

      - name: Retired legacy dataset guard
        run: python scripts/check_no_retired_legacy_paths.py

      - name: Compile imports
        run: python -m compileall app.py src scripts

  backend-unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    needs: backend-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e .
          python -m pip install pytest==8.4.2

      - name: Unit tests
        run: python -m pytest -q -p no:cacheprovider

  backend-integration-tests:
    name: Backend integration and deploy preflight
    runs-on: ubuntu-latest
    needs: backend-unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e .
          python -m pip install pytest==8.4.2

      - name: API integration contract tests
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_core.py::test_transaction_candidate_endpoint_is_feature_flagged_and_batch_safe \
            tests/test_core.py::test_transaction_mode_readiness_does_not_require_baseline_artifacts \
            tests/test_core.py::test_transaction_candidate_endpoint_enforces_batch_row_limit \
            tests/test_core.py::test_service_index_reports_backend_api_surface

      - name: Fixture predeploy validation
        run: python scripts/provider_predeploy.py

  api-surface-checks:
    name: Backend API surface checks
    runs-on: ubuntu-latest
    needs: backend-integration-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e .
          python -m pip install pytest==8.4.2

      - name: Confirm server-rendered frontend is removed
        run: |
          python - <<'PY'
          from pathlib import Path

          removed = [Path("templates/index.html"), Path("templates/result.html")]
          present = [str(path) for path in removed if path.exists()]
          if present:
              raise SystemExit(f"removed frontend templates are still present: {present}")
          PY

      - name: API surface tests
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_core.py::test_service_index_reports_backend_api_surface \
            tests/test_core.py::test_transaction_batch_endpoint_requires_server_api_key_when_auth_is_enabled

      - name: API production import check
        run: |
          python -m compileall app.py src
          echo "No server-rendered frontend is packaged; API only."

      - name: Browser smoke tests
        run: |
          if test -d tests/browser; then
            python -m pytest -q tests/browser
          else
            echo "No browser smoke suite is present; container smoke verifies served API."
          fi

  docker-production-image:
    name: Production Docker image and container smoke
    runs-on: ubuntu-latest
    needs: api-surface-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute build metadata
        id: metadata
        run: |
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build production Docker image
        run: |
          docker build \
            --build-arg BUILD_COMMIT_SHA="${GITHUB_SHA}" \
            --build-arg BUILD_TIME="${{ steps.metadata.outputs.build_time }}" \
            -t fraudguard-api:${GITHUB_SHA} .

      - name: Start container and smoke test served API
        run: |
          set -euo pipefail
          container_name="fraudguard-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker rm -f "$container_name" >/dev/null 2>&1 || true

          cleanup() {
            status=$?
            docker logs "$container_name" >/tmp/fraudguard-container.log 2>&1 || true
            docker rm -f "$container_name" >/dev/null 2>&1 || true
            if [ "$status" -ne 0 ]; then
              cat /tmp/fraudguard-container.log || true
            fi
            exit "$status"
          }
          trap cleanup EXIT

          docker run -d \
            --name "$container_name" \
            -p 8010:8010 \
            -e PORT=8010 \
            -e APP_ENV=ci \
            -e FRAUD_MODEL_MODE=transaction_candidate \
            -e AUTH_REQUIRED=true \
            -e FRAUDGUARD_API_KEY=ci-test-key \
            fraudguard-api:${GITHUB_SHA}

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:8010/live >/tmp/live.json; then
              break
            fi
            sleep 2
          done

          python - <<'PY'
          import json
          import os
          import urllib.request

          expected_sha = os.environ["GITHUB_SHA"]

          with urllib.request.urlopen("http://localhost:8010/live", timeout=10) as response:
              live = json.loads(response.read().decode("utf-8"))
          assert live["status"] == "alive", live

          with urllib.request.urlopen("http://localhost:8010/version", timeout=10) as response:
              version = json.loads(response.read().decode("utf-8"))
          assert version["commit_sha"] == expected_sha, version

          with urllib.request.urlopen("http://localhost:8010/", timeout=10) as response:
              service_index = json.loads(response.read().decode("utf-8"))
          assert service_index["service"] == "FraudGuard API", service_index
          assert service_index["endpoints"]["transaction_batch_prediction"] == "/predict/transactions", service_index
          PY
