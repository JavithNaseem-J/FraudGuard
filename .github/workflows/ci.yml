name: FraudGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  UV_VERSION: "0.11.15"
  APP_ENV: ci

jobs:
  backend:
    name: Backend quality, tests, and model fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -e . --no-deps

      - name: Verify dependency locks are reproducible
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv pip compile pyproject.toml --universal --python-version 3.11 -o requirements.lock
          uv pip compile pyproject.toml --extra dev --universal --python-version 3.11 -o requirements-dev.lock
          git diff --exit-code -- requirements.lock requirements-dev.lock

      - name: Check backend formatting
        run: black --check app.py src tests scripts

      - name: Lint backend
        run: flake8 app.py src tests scripts --max-line-length=120 --extend-ignore=E203,W503

      - name: Run backend static type analysis
        run: |
          python -m mypy app.py src/FraudGuard/cloud src/FraudGuard/pipeline \
            --ignore-missing-imports --no-strict-optional \
            --allow-untyped-defs --check-untyped-defs

      - name: Run backend unit tests
        run: python -m pytest -p no:cacheprovider -m "not integration"

      - name: Run backend integration tests
        run: python -m pytest -p no:cacheprovider -m integration

      - name: Compile imports
        run: python -m compileall app.py src scripts

      - name: Build container smoke model fixture
        run: python -m scripts.build_ci_model_fixture --output artifacts/ci-model

      - uses: actions/upload-artifact@v4
        with:
          name: ci-model-fixture
          path: artifacts/ci-model/
          if-no-files-found: error

  frontend:
    name: Frontend tests, audit, and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Audit production frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

  container:
    name: Production image and live-container smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ci-model-fixture
          path: artifacts/ci-model

      - name: Compute build time
        id: metadata
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build production image
        run: |
          docker build \
            --build-arg BUILD_COMMIT_SHA="${GITHUB_SHA}" \
            --build-arg BUILD_TIME="${{ steps.metadata.outputs.build_time }}" \
            -t fraudguard:${GITHUB_SHA} .

      - name: Start and verify the built container
        run: |
          set -euo pipefail
          container_name="fraudguard-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            status=$?
            docker logs "$container_name" > /tmp/fraudguard-container.log 2>&1 || true
            docker rm -f "$container_name" >/dev/null 2>&1 || true
            if [ "$status" -ne 0 ]; then cat /tmp/fraudguard-container.log; fi
            exit "$status"
          }
          trap cleanup EXIT

          docker run -d \
            --name "$container_name" \
            -p 8010:8010 \
            -v "${PWD}/artifacts/ci-model:/tmp/fraudguard-ci-model:ro" \
            -e PORT=8010 \
            -e APP_ENV=ci \
            -e TRANSACTION_ARTIFACT_ROOT=/tmp/fraudguard-ci-model \
            fraudguard:${GITHUB_SHA}

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8010/ready > /tmp/ready.json; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Container did not become ready within 60 seconds." >&2
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import urllib.request

          def request(path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(
                  f"http://localhost:8010{path}",
                  data=data,
                  headers={"Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=10) as response:
                  return response.headers.get_content_type(), json.loads(response.read())

          _, ready = request("/ready")
          assert ready["status"] == "ready", ready
          _, version = request("/version")
          assert version["commit_sha"] == os.environ["GITHUB_SHA"], version
          _, schema = request("/schema/transactions")
          row = {"TransactionDT": 86400, "TransactionAmt": 57.25}
          _, result = request("/predict/transactions", {"rows": [row]})
          assert result["row_count"] == 1, result
          _, dashboard = request("/dashboard")
          assert "transaction_count" in dashboard, dashboard
          with urllib.request.urlopen("http://localhost:8010/", timeout=10) as response:
              html = response.read().decode()
          assert '<div id="root"></div>' in html
          PY
