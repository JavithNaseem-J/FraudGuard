name: Render Production Deploy

on:
  workflow_run:
    workflows:
      - FraudGuard CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Optional full commit SHA to deploy. If omitted, the workflow branch HEAD is used."
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: render-production
  cancel-in-progress: false

jobs:
  resolve-commit:
    name: Resolve exact deploy commit
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    outputs:
      exact_sha: ${{ steps.resolve.outputs.exact_sha }}
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v4
        with:
          ref: >-
            ${{
              github.event_name == 'workflow_run' &&
              github.event.workflow_run.head_sha ||
              inputs.commit_sha ||
              github.sha
            }}
          fetch-depth: 0

      - name: Resolve and validate full SHA
        id: resolve
        run: |
          set -euo pipefail
          exact_sha="$(git rev-parse HEAD)"
          if ! printf '%s' "$exact_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Resolved value is not a full 40-character Git SHA: $exact_sha" >&2
            exit 1
          fi
          echo "exact_sha=$exact_sha" >> "$GITHUB_OUTPUT"
          echo "Resolved deploy SHA: $exact_sha"

      - name: Verify selected SHA has successful CI run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        env:
          EXACT_SHA: ${{ steps.resolve.outputs.exact_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = process.env.EXACT_SHA;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              status: 'completed',
              per_page: 100,
            });
            const matching = runs.filter((run) => run.head_sha === sha);
            const successful = matching.find((run) => run.conclusion === 'success');
            if (!successful) {
              core.setFailed(`No successful completed FraudGuard CI run found on main for ${sha}.`);
              return;
            }
            core.info(`Verified successful CI run ${successful.html_url} for ${sha}.`);

  deploy-render:
    name: Deploy exact SHA to Render
    runs-on: ubuntu-latest
    needs: resolve-commit
    environment: production
    env:
      EXACT_SHA: ${{ needs.resolve-commit.outputs.exact_sha }}
    steps:
      - name: Checkout exact deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SHA }}

      - name: Trigger Render deploy hook for exact SHA
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          mkdir -p deployment-verification
          if [ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is required." >&2
            exit 1
          fi
          separator="?"
          case "$RENDER_DEPLOY_HOOK_URL" in
            *\?*) separator="&" ;;
          esac
          deploy_url="${RENDER_DEPLOY_HOOK_URL}${separator}ref=${EXACT_SHA}"
          status_code="$(curl --silent --show-error --output deployment-verification/render-hook-response.txt --write-out '%{http_code}' --request POST "$deploy_url")"
          cat > deployment-verification/render-hook.json <<JSON
          {
            "commit_sha": "$EXACT_SHA",
            "http_status": "$status_code"
          }
          JSON
          if ! printf '%s' "$status_code" | grep -Eq '^2[0-9][0-9]$'; then
            echo "Render deploy hook failed with HTTP $status_code" >&2
            cat deployment-verification/render-hook-response.txt >&2 || true
            exit 1
          fi

      - name: Wait for production and verify exact version
        env:
          PUBLIC_BASE_URL: ${{ secrets.RENDER_PUBLIC_BASE_URL }}
          FRAUDGUARD_API_KEY: ${{ secrets.FRAUDGUARD_API_KEY }}
          EXPECTED_COMMIT_SHA: ${{ env.EXACT_SHA }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_BASE_URL:-}" ]; then
            echo "RENDER_PUBLIC_BASE_URL secret is required for production verification." >&2
            exit 1
          fi
          if [ -z "${FRAUDGUARD_API_KEY:-}" ]; then
            echo "FRAUDGUARD_API_KEY secret is required for production prediction smoke tests." >&2
            exit 1
          fi
          python scripts/render_smoke.py 2>&1 | tee deployment-verification/render-smoke.log
          cat > deployment-verification/summary.json <<JSON
          {
            "commit_sha": "$EXPECTED_COMMIT_SHA",
            "public_base_url": "$PUBLIC_BASE_URL",
            "verified": true
          }
          JSON

      - name: Upload deployment verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-verification-${{ env.EXACT_SHA }}
          path: deployment-verification/
          if-no-files-found: warn
