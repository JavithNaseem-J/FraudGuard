stages:
  transaction_benchmark:
    cmd: python -m scripts.transaction_benchmark --sample-rows 75000
    deps:
      - src/FraudGuard/data/transaction_benchmark.py
      - src/FraudGuard/utils/costs.py
      - scripts/transaction_benchmark.py
      - data/train_transaction.csv
    outs:
      - artifacts/benchmark/transaction_data/preparation_report.json
      - artifacts/benchmark/transaction_data/smoke_benchmark_report.json
      - artifacts/benchmark/transaction_data/strong_benchmark_report.json
      - artifacts/benchmark/transaction_data/evaluated-model
