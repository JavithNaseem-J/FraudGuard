[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudguard"
version = "1.0.0"
description = "Production-style transaction fraud scoring demonstration."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.110.0",
  "joblib>=1.3.0",
  "lightgbm>=4.0.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "pydantic>=2.0.0",
  "scikit-learn>=1.4.0",
  "scipy>=1.10.0",
  "uvicorn[standard]>=0.28.0",
]

[project.optional-dependencies]
dev = [
  "black==26.5.1",
  "dvc>=3.60,<4",
  "evidently>=0.7,<1",
  "flake8==7.3.0",
  "httpx>=0.27,<1",
  "mypy==1.20.2",
  "pytest==8.4.2",
  "pytest-cov>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --basetemp=pytest-run-temp"
pythonpath = ["src", "."]
asyncio_mode = "strict"
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 3
markers = [
  "integration: exercises the FastAPI application across component boundaries",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
allow_untyped_defs = true
check_untyped_defs = true
